repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - docs/CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-biovat_logo_light.png
    - docs/images/nf-core-biovat_logo_light.png
    - docs/images/nf-core-biovat_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - CODE_OF_CONDUCT.md
    - assets/nf-core-biovat_logo_light.png
    - docs/images/nf-core-biovat_logo_light.png
    - docs/images/nf-core-biovat_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt

template:
  org: NBISweden
  name: biovat
  description: BioVAT (BIOdiversity Variant Analysis Toolkit), a modular Nextflow
    pipeline for population genomics analysis of non-model organisms
  author: Verena E. Kutschera
  version: 0.0.1
  force: true
  outdir: .
  skip_features:
    - igenomes
    - seqera_platform
    - codespaces
    - vscode
    - email
  is_nfcore: false
