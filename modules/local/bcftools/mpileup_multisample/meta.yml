name: bcftools_mpileup_multisample
description: Joint (multi-sample) variant calling across a group of BAM files using bcftools mpileup/call
keywords:
  - variant calling
  - mpileup
  - multi-sample
  - joint calling
  - VCF
tools:
  - mpileup:
      description: |
        Generates genotype likelihoods at each genomic position with coverage, jointly across
        multiple samples in a single BAM/BCF stream.
      homepage: http://samtools.github.io/bcftools/bcftools.html
      documentation: http://www.htslib.org/doc/bcftools.html
      doi: 10.1093/bioinformatics/btp352
      licence:
        - "MIT"
      identifier: biotools:bcftools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing group information. Must contain `population` (group/cohort id used
          for output naming, since `id` is reserved for sample identification elsewhere in the
          pipeline) and `samples` (a List of sample names, in the same order as `bam`, used to
          rename the VCF sample columns via `bcftools reheader`).
          e.g. [ population:'population1', samples:['sample1', 'sample2'] ]
    - bam:
        type: file
        description: One or more input BAM files to call jointly, in the same order as `meta.samples`
        pattern: "*.{bam}"
        ontologies: []
    - intervals_mpileup:
        type: file
        description: Input intervals file. A file (commonly '.bed') containing
          regions to subset used by mpileup
        ontologies: []
    - intervals_call:
        type: file
        description: Input intervals file. A file (commonly '.bed') containing
          regions to subset used by call but need a fourth column with REF,ALT
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: FASTA reference file
        pattern: "*.{fasta,fa}"
        ontologies: []
    - fai:
        type: file
        description: FASTA reference file index
        pattern: "*.fai"
        ontologies: []
  - - save_mpileup:
        type: boolean
        description: Save the mpileup output as well as the VCF
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing group information
            e.g. [ population:'population1', samples:['sample1', 'sample2'] ]
      - "*vcf.gz":
          type: file
          description: Compressed joint-called VCF file
          pattern: "*.vcf.gz"
          ontologies: []
  index:
    - - meta:
          type: map
          description: |
            Groovy Map containing group information
            e.g. [ population:'population1', samples:['sample1', 'sample2'] ]
      - "*.{tbi,csi}":
          type: file
          description: Index of the VCF file
          pattern: "*.{tbi,csi}"
          ontologies: []
  stats:
    - - meta:
          type: map
          description: |
            Groovy Map containing group information
            e.g. [ population:'population1', samples:['sample1', 'sample2'] ]
      - "*stats.txt":
          type: file
          description: Text output of bcftools stats
          pattern: "*.{stats.txt}"
          ontologies: []
  mpileup:
    - - meta:
          type: map
          description: |
            Groovy Map containing group information
            e.g. [ population:'population1', samples:['sample1', 'sample2'] ]
      - "*.mpileup.gz":
          type: file
          description: Compressed mpileup output, optional
          pattern: "*.{mpileup.gz}"
          ontologies: []
  versions_bcftools:
    - - topic: versions
