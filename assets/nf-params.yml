## ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
##     BioVAT 0.0.1
## ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
##     This is an example parameter file provide custom parameters to BioVAT.
##
##     Uncomment lines with a single '#' if you want to pass the parameter to
##     the pipeline and edit/add the parameters below as needed.
##
##     Provide the file to nextflow using the '-params-file' option, e.g.:
##     $ nextflow main.nf -profile <PROFILES> -params-file nf-params.yml
##
##     For a full list of available parameters and their defaults, run:
##     $ pixi run help
## -----------------------------------------------------------------------------

## =============================================================================
## Input/output options
## =============================================================================

input: "assets/samplesheet.csv" # Path to comma-separated file containing information about the samples
reference: "tests/data/monkeyflower/M_aurantiacus_v1_splitline_ordered.fasta" # Path to reference genome FASTA file
outdir: "results" # The output directory where the results will be saved. You have to use absolute paths to storage on Cloud infrastructure.
# publish_dir_mode: "copy" # How to publish results to the output directory (accepted: copy, symlink, move, rellink, link, copyNoFollow). Default: copy

## =============================================================================
## Workflow stages
## =============================================================================

## Input data quality checks
enable_raw_read_qc: true # Boolean: run quality checks on raw reads

## Read trimming and alignment
enable_trim: true # Boolean: run read trimming
enable_align: true # Boolean: align reads to reference genome
enable_align_qc: true # Boolean: run quality checks on alignment files (BAM/CRAM)

## Alignment processing
enable_mark_duplicates: true # Boolean: mark or remove duplicate reads in alignment files (BAM/CRAM)


