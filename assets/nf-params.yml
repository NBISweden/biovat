## ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
##     BioVAT 0.0.1
## ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
##     This is an example parameter file to pass to the `-params-file` option
##     of nextflow run with the BioVAT pipeline.
##
##     Uncomment lines with a single '#' if you want to pass the parameter to
##     the pipeline.
## -----------------------------------------------------------------------------

## =============================================================================
## Input/output options
## =============================================================================
## Define where the pipeline should find input data and save output data.

## -----------------------------------------------------------------------------
## input
## -----------------------------------------------------------------------------
##     Path to comma-separated file containing information about the samples
##     in the experiment.
##     Type: string
##     Required
## -----------------------------------------------------------------------------
input: "assets/samplesheet.csv"

## -----------------------------------------------------------------------------
## reference
## -----------------------------------------------------------------------------
##     Path to reference genome FASTA file.
##     Type: string
## -----------------------------------------------------------------------------
reference: "tests/data/sumatran_rhino.fasta"

## -----------------------------------------------------------------------------
## steps
## -----------------------------------------------------------------------------
##     Comma-separated list of steps (subworkflows) to run.
##     Type: string
## -----------------------------------------------------------------------------
steps: "align"

## -----------------------------------------------------------------------------
## outdir
## -----------------------------------------------------------------------------
##     The output directory where the results will be saved. You have to use
##     absolute paths to storage on Cloud infrastructure.
##     Type: string
##     Required
## -----------------------------------------------------------------------------
outdir: "results"

## =============================================================================
## Alignment options
## =============================================================================
## Configure read alignment behavior.

## -----------------------------------------------------------------------------
## aligner
## -----------------------------------------------------------------------------
##     Alignment tool choice.
##     Type: string
## -----------------------------------------------------------------------------
# aligner: "bwa-mem3"

## -----------------------------------------------------------------------------
## align_raw_reads
## -----------------------------------------------------------------------------
##     Align raw reads to the reference, instead of the default (trimmed
##     reads).
##     Type: boolean
## -----------------------------------------------------------------------------
# align_raw_reads: false

## -----------------------------------------------------------------------------
## sort_bam
## -----------------------------------------------------------------------------
##     Sort the BAM output from BWA.
##     Type: boolean
## -----------------------------------------------------------------------------
# sort_bam: true

## =============================================================================
## GPU acceleration options
## =============================================================================
## Configure GPU resources and job scheduling for GPU-accelerated tasks.

## -----------------------------------------------------------------------------
## gpu_partition
## -----------------------------------------------------------------------------
##     Name of the NVIDIA GPU partition on HPC system.
##     Type: string
## -----------------------------------------------------------------------------
# gpu_partition: "gpu"

## -----------------------------------------------------------------------------
## gpu_resources
## -----------------------------------------------------------------------------
##     Request GPU resources. Defaults to '1'. Examples: '2' (2 GPUs),
##     'h100:2' (2 H100 GPUs).
##     Type: string
## -----------------------------------------------------------------------------
# gpu_resources: null



## =============================================================================
## Institutional config options
## =============================================================================
## Parameters used to describe centralised config profiles. These should not
## be edited.

## (6 hidden parameters are not shown)

## =============================================================================
## Generic options
## =============================================================================
## Less common options for the pipeline, typically set in a config file.

## (9 hidden parameters are not shown)

## -----------------------------------------------------------------------------
## multiqc_title
## -----------------------------------------------------------------------------
##     MultiQC report title. Printed as page header, used for filename if not
##     otherwise specified.
##     Type: string
## -----------------------------------------------------------------------------
# multiqc_title: null

## -----------------------------------------------------------------------------
## multiqc_methods_description
## -----------------------------------------------------------------------------
##     Custom MultiQC yaml file containing HTML including a methods
##     description.
##     Type: string
## -----------------------------------------------------------------------------
# multiqc_methods_description: null

## -----------------------------------------------------------------------------
## help
## -----------------------------------------------------------------------------
##     Display the help message.
##     Type: ['boolean', 'string']
## -----------------------------------------------------------------------------
# help: null

## -----------------------------------------------------------------------------
## help_full
## -----------------------------------------------------------------------------
##     Display the full detailed help message.
##     Type: boolean
## -----------------------------------------------------------------------------
# help_full: null

## -----------------------------------------------------------------------------
## show_hidden
## -----------------------------------------------------------------------------
##     Display hidden parameters in the help message (only works when --help
##     or --help_full are provided).
##     Type: boolean
## -----------------------------------------------------------------------------
# show_hidden: null
