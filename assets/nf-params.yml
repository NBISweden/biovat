## ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
##     BioVAT 0.0.1
## ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
##     This is an example parameter file to pass to the `-params-file` option
##     of nextflow run with the BioVAT pipeline.
##
##     Uncomment lines with a single '#' if you want to pass the parameter to
##     the pipeline.
## -----------------------------------------------------------------------------

## =============================================================================
## Input/output options
## =============================================================================
## Define where the pipeline should find input data and save output data.

## -----------------------------------------------------------------------------
## input
## -----------------------------------------------------------------------------
##     Path to comma-separated file containing information about the samples
##     in the experiment.
##     Type: string
##     Required
## -----------------------------------------------------------------------------
input: "assets/samplesheet.csv"

## -----------------------------------------------------------------------------
## reference
## -----------------------------------------------------------------------------
##     Path to reference genome FASTA file.
##     Type: string
## -----------------------------------------------------------------------------
reference: "tests/data/sumatran_rhino.fasta"

## =============================================================================
## Workflow stage gating options
## =============================================================================
## Define which stages of the pipeline should be run.

## -----------------------------------------------------------------------------
## enable_raw_read_qc
## -----------------------------------------------------------------------------
##     Run quality checks on raw reads.
##     Type: boolean
## -----------------------------------------------------------------------------
enable_raw_read_qc: true

## -----------------------------------------------------------------------------
## enable_trim
## -----------------------------------------------------------------------------
##     Run the trimming stage.
##     Type: boolean
## -----------------------------------------------------------------------------
enable_trim: true

## -----------------------------------------------------------------------------
## enable_trimmed_read_qc
## -----------------------------------------------------------------------------
##     Run additional quality checks on trimmed reads.
##     Type: boolean
## -----------------------------------------------------------------------------
enable_trimmed_read_qc: true

## -----------------------------------------------------------------------------
## enable_align
## -----------------------------------------------------------------------------
##     Run the alignment stage.
##     Type: boolean
## -----------------------------------------------------------------------------
enable_align: true

## -----------------------------------------------------------------------------
## outdir
## -----------------------------------------------------------------------------
##     The output directory where the results will be saved. You have to use
##     absolute paths to storage on Cloud infrastructure.
##     Type: string
##     Required
## -----------------------------------------------------------------------------
outdir: "results"

## =============================================================================
## Raw read quality check options
## =============================================================================
## Configure read quality check behavior.

## -----------------------------------------------------------------------------
## fastp_report
## -----------------------------------------------------------------------------
##     Run FastP to generate an output report even when trimming is disabled.
##     Type: boolean
## -----------------------------------------------------------------------------
# fastp_report: false

## =============================================================================
## Trimming options
## =============================================================================
## Configure read trimming behavior.

## -----------------------------------------------------------------------------
## adapter_fasta
## -----------------------------------------------------------------------------
##     Path to FASTA file containing adapter sequences.
##     Type: string
## -----------------------------------------------------------------------------
# adapter_fasta: null

## =============================================================================
## Alignment options
## =============================================================================
## Configure read alignment behavior.

## -----------------------------------------------------------------------------
## aligner
## -----------------------------------------------------------------------------
##     Alignment tool choice.
##     Type: string
## -----------------------------------------------------------------------------
# aligner: "bwa-mem3"

## -----------------------------------------------------------------------------
## sort_bam
## -----------------------------------------------------------------------------
##     Sort the BAM output from BWA.
##     Type: boolean
## -----------------------------------------------------------------------------
# sort_bam: true

## =============================================================================
## help
## =============================================================================
##     Display the help message.
##     Type: ['boolean', 'string']
## -----------------------------------------------------------------------------
# help: null

## -----------------------------------------------------------------------------
## help_full
## -----------------------------------------------------------------------------
##     Display the full detailed help message.
##     Type: boolean
## -----------------------------------------------------------------------------
# help_full: null

## -----------------------------------------------------------------------------
## show_hidden
## -----------------------------------------------------------------------------
##     Display hidden parameters in the help message (only works when --help
##     or --help_full are provided).
##     Type: boolean
## -----------------------------------------------------------------------------
# show_hidden: null
