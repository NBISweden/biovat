report_comment: >
  This report has been generated by the <a href="https://github.com/NBISweden/biovat" target="_blank">biovat</a>
  analysis pipeline.
report_section_order:
  "biovat-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "NBISweden-biovat-summary":
    order: -1002

module_order:
- fastqc:
    name: "FastQC: raw read quality"
    anchor: "fastqc_raw"
- fastp:
    name: "fastp: read trimming/filtering"
    anchor: "fastp"
- samtools:
    name: "flagstat: summary BAM metrics"
    anchor: "samtools_flagstat"
- riker:
    name: "Riker: detailed BAM metrics"
    anchor: "riker"

custom_plot_config:
  general_stats_table:
    format: "{:,.2f}"
  samtools-flagstat-table:
    no_violin: true
    format: "{:,.2f}"
  samtools-flagstat-pct-table:
    no_violin: true

export_plots: true

disable_version_detection: true
