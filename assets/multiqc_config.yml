report_comment: >
  This report has been generated by the <a href="https://github.com/NBISweden/biovat" target="_blank">biovat</a>
  analysis pipeline.
report_section_order:
  "biovat-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "NBISweden-biovat-summary":
    order: -1002

module_order:
  - fastqc:
      name: "FastQC: raw read quality"
      anchor: "fastqc_raw"
  - fastp:
      name: "fastp: read trimming/filtering"
      anchor: "fastp"
  - samtools:
      name: "flagstat: library alignment metrics"
      anchor: "samtools_flagstat_library"
      path_filters:
        - "*library_*"
  - riker:
      name: "Riker: library alignment metrics"
      anchor: "riker_library"
      path_filters:
        - "*library_*"
  - qualimap:
      name: "Qualimap: library alignment metrics"
      anchor: "qualimap_library"
      path_filters:
        - "*library_*"
  - samtools:
      name: "flagstat: sample alignment metrics"
      anchor: "samtools_flagstat_sample"
      path_filters:
        - "*sample_*"
  - riker:
      name: "Riker: sample alignment metrics"
      anchor: "riker_sample"
      path_filters:
        - "*sample_*"
  - qualimap:
      name: "Qualimap: sample alignment metrics"
      anchor: "qualimap_sample"
      path_filters:
        - "*sample_*"
  - picard:
      name: "Picard: duplicate marking metrics"
      anchor: "picard_markduplicates"
      path_filters:
        - "*_markdup*"
  - samtools:
      name: "Samtools markdup: duplicate marking metrics"
      anchor: "samtools_markdup"
      path_filters:
        - "*_markdup*"
  - samtools:
      name: "flagstat: duplicate-marked alignment metrics"
      anchor: "samtools_flagstat_markdup"
      path_filters:
        - "*markdup_*"
  - riker:
      name: "Riker: duplicate-marked alignment metrics"
      anchor: "riker_markdup"
      path_filters:
        - "*markdup_*"
  - qualimap:
      name: "Qualimap: duplicate-marked alignment metrics"
      anchor: "qualimap_markdup"
      path_filters:
        - "*markdup_*"

custom_plot_config:
  general_stats_table:
    format: "{:,.2f}"
  samtools-flagstat-table:
    no_violin: true
    format: "{:,.2f}"
  samtools-flagstat-pct-table:
    no_violin: true

export_plots: true

disable_version_detection: true

# MultiQC v1.35 ships a broken samtools/markdup_txt search pattern that checks for
# the literal substring "^COMMAND:" instead of anchoring a regex, so real
# `samtools markdup` output (which starts with "COMMAND:", no caret) never matches.
sp:
  samtools/markdup_txt:
    contents:
      - "COMMAND:"
      - "samtools markdup"
    num_lines: 2
