      anchor: "fastp"
  - samtools:
      name: "flagstat: input BAM/CRAM alignment metrics"
      anchor: "samtools_flagstat_input"
      path_filters:
        - "*input_*"
  - riker:
      name: "Riker: input BAM/CRAM alignment metrics"
      anchor: "riker_input"
      path_filters:
        - "*input_*"
  - qualimap:
      name: "Qualimap: input BAM/CRAM alignment metrics"
      anchor: "qualimap_input"
      path_filters:
        - "*input_*"
  - samtools:
      name: "flagstat: read group alignment metrics"
      anchor: "samtools_flagstat_readgroup"
      path_filters:
        - "*readgroup_*"
  - riker:
      name: "Riker: read group alignment metrics"
      anchor: "riker_readgroup"
      path_filters:
        - "*readgroup_*"
  - qualimap:
      name: "Qualimap: read group alignment metrics"
      anchor: "qualimap_readgroup"
      path_filters:
        - "*readgroup_*"
  - samtools:
      name: "flagstat: library alignment metrics"
      anchor: "samtools_flagstat_library"
      path_filters:
        - "*library_*"
  - riker:
      name: "Riker: library alignment metrics"
      anchor: "riker_library"
      path_filters:
        - "*library_*"
  - qualimap:
      name: "Qualimap: library alignment metrics"
      anchor: "qualimap_library"
      path_filters:
        - "*library_*"
  - samtools:
      name: "flagstat: sample alignment metrics"
      anchor: "samtools_flagstat_sample"
      path_filters:
        - "*sample_*"
  - riker:
      name: "Riker: sample alignment metrics"
      anchor: "riker_sample"
      path_filters:
        - "*sample_*"
  - qualimap:
      name: "Qualimap: sample alignment metrics"
      anchor: "qualimap_sample"
      path_filters:
        - "*sample_*"
  - picard:
      name: "Picard: duplicate marking metrics"
      anchor: "picard_markduplicates"
      path_filters:
        - "*_markdup*"
  - samtools:
      name: "Samtools markdup: duplicate marking metrics"
      anchor: "samtools_markdup"
      path_filters:
        - "*_markdup*"
  - samtools:
      name: "flagstat: duplicate-marked alignment metrics"
      anchor: "samtools_flagstat_markdup"
      path_filters:
        - "*markdup_*"
  - riker:
      name: "Riker: duplicate-marked alignment metrics"
      anchor: "riker_markdup"
      path_filters:
        - "*markdup_*"
  - qualimap:
      name: "Qualimap: duplicate-marked alignment metrics"
      anchor: "qualimap_markdup"
      path_filters:
        - "*markdup_*"

# Riker reports the BAM @RG SM tag as its sample name, which is shared by every read group and library of a
# sample, so all but one of them would be silently dropped. Use the (level-prefixed) file name instead.
use_filename_as_sample_name:
  - riker/alignment
  - riker/basic_base_dist
  - riker/basic_mean_quality
  - riker/basic_quality_dist
  - riker/gcbias_detail
  - riker/gcbias_summary
  - riker/isize_metrics
  - riker/isize_histogram
  - riker/wgs_metrics
  - riker/wgs_coverage
extra_fn_clean_exts:
  - ".alignment-metrics"
  - ".base-distribution-by-cycle"
  - ".mean-quality-by-cycle"
  - ".quality-score-distribution"
  - ".gcbias-detail"
  - ".gcbias-summary"
  - ".isize-metrics"
  - ".isize-histogram"
  - ".wgs-metrics"
  - ".wgs-coverage"

custom_plot_config:
  general_stats_table:
    format: "{:,.2f}"
  samtools-flagstat-table:
    no_violin: true
    format: "{:,.2f}"
  samtools-flagstat-pct-table:
    no_violin: true

export_plots: true

disable_version_detection: true

# MultiQC v1.35 ships a broken samtools/markdup_txt search pattern that checks for
# the literal substring "^COMMAND:" instead of anchoring a regex, so real
# `samtools markdup` output (which starts with "COMMAND:", no caret) never matches.
sp:
  samtools/markdup_txt:
    contents:
      - "COMMAND:"
      - "samtools markdup"
    num_lines: 2
